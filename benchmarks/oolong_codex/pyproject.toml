[project]
name = "oolong-codex-benchmark"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.0",
    "psutil>=6.0",
    "python-dateutil>=2.9",
    "rlms[codex]",
]

[project.scripts]
oolong-codex = "oolong_codex.cli:entrypoint"

[tool.uv.sources]
rlms = { path = "../..", editable = true }

[dependency-groups]
test = [
    "pytest>=9.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oolong_codex"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]
